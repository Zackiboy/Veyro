```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Veyro Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070707;
      --surface: #111;
      --surface-2: #171717;
      --text: #f5f5f5;
      --muted: #999;
      --border: rgba(255,255,255,0.09);
      --accent: #ff4b32;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 25px;
      padding: 40px;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 35px;
    }

    .login-box h1 {
      font-size: 42px;
      letter-spacing: -2px;
      margin-bottom: 10px;
    }

    .login-box p {
      color: var(--muted);
      margin-bottom: 30px;
    }

    .login-box input {
      width: 100%;
      padding: 15px 18px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #090909;
      color: white;
      outline: none;
    }

    .login-box input:focus {
      border-color: rgba(255,255,255,0.3);
    }

    .login-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-weight: 800;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      color: #ff6b55;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }

    /* DASHBOARD */

    #dashboard {
      display: none;
    }

    header {
      padding: 22px 6%;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .admin-label {
      color: var(--muted);
      font-size: 14px;
    }

    .logout {
      border: 1px solid var(--border);
      background: transparent;
      color: white;
      padding: 9px 15px;
      border-radius: 999px;
      cursor: pointer;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 60px 6%;
    }

    h2 {
      font-size: clamp(45px, 6vw, 70px);
      letter-spacing: -4px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 45px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 40px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 42px;
      font-weight: 800;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }

    .panel-header {
      padding: 22px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .panel-header h3 {
      font-size: 20px;
    }

    .refresh {
      border: none;
      background: white;
      color: black;
      padding: 9px 16px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 17px 25px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    td {
      color: #ddd;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 50px;
    }

    .status {
      margin-top: 20px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 750px) {
      .stats {
        grid-template-columns: 1fr;
      }

      header {
        padding: 18px 5%;
      }

      main {
        padding: 40px 5%;
      }

      th,
      td {
        padding: 14px;
      }

      .login-box {
        padding: 30px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN SCREEN -->

  <div id="loginScreen">

    <div class="login-box">

      <div class="logo">VEYRO</div>

      <h1>Admin.</h1>

      <p>
        Sign in to manage the Veyro One waitlist.
      </p>

      <form id="loginForm">

        <input
          type="email"
          id="loginEmail"
          placeholder="Admin email"
          autocomplete="email"
          required
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          Sign In
        </button>

      </form>

      <div class="error" id="loginError"></div>

    </div>

  </div>


  <!-- DASHBOARD -->

  <div id="dashboard">

    <header>

      <div class="header-left">

        <div class="logo">
          VEYRO
        </div>

        <div class="admin-label">
          ADMIN DASHBOARD
        </div>

      </div>

      <button class="logout" id="logoutButton">
        Log Out
      </button>

    </header>


    <main>

      <h2>Dashboard.</h2>

      <p class="subtitle">
        Veyro One waitlist overview.
      </p>


      <!-- STATS -->

      <div class="stats">

        <div class="stat">

          <div class="stat-label">
            TOTAL SIGNUPS
          </div>

          <div
            class="stat-value"
            id="totalSignups"
          >
            —
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            TODAY
          </div>

          <div
            class="stat-value"
            id="todaySignups"
          >
            —
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            LATEST SIGNUP
          </div>

          <div
            class="stat-value"
            id="latestSignup"
          >
            —
          </div>

        </div>

      </div>


      <!-- WAITLIST -->

      <div class="panel">

        <div class="panel-header">

          <h3>
            Waitlist
          </h3>

          <button
            class="refresh"
            id="refreshButton"
          >
            Refresh
          </button>

        </div>


        <div class="table-wrapper">

          <table>

            <thead>

              <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Joined</th>
              </tr>

            </thead>

            <tbody id="waitlistBody">

              <tr>
                <td
                  colspan="3"
                  class="empty"
                >
                  Loading...
                </td>
              </tr>

            </tbody>

          </table>

        </div>

      </div>


      <div
        class="status"
        id="status"
      >
        Connecting...
      </div>

    </main>

  </div>


  <!-- SUPABASE -->

  <script>

    const SUPABASE_URL =
      "https://vltduiizkbzuupeyjdms.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_RZSnpBfbRIwQju3yqJl3eQ_ZugOxIdJ";


    /*
      SUPABASE AUTH
    */

    async function supabaseRequest(
      endpoint,
      options = {}
    ) {

      const response = await fetch(
        `${SUPABASE_URL}${endpoint}`,
        {
          ...options,

          headers: {
            "Content-Type": "application/json",

            "apikey":
              SUPABASE_ANON_KEY,

            ...options.headers
          }
        }
      );

      return response;
    }


    /*
      LOGIN
    */

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const loginError =
      document.getElementById("loginError");


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document
            .getElementById("loginEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("loginPassword")
            .value;


        loginButton.disabled = true;
        loginButton.textContent = "Signing In...";
        loginError.textContent = "";


        try {

          const response =
            await supabaseRequest(
              "/auth/v1/token?grant_type=password",
              {
                method: "POST",

                body: JSON.stringify({
                  email: email,
                  password: password
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.error_description ||
              data.msg ||
              "Login failed."
            );

          }


          /*
            Save the access token temporarily.
          */

          localStorage.setItem(
            "veyro_access_token",
            data.access_token
          );

          localStorage.setItem(
            "veyro_refresh_token",
            data.refresh_token
          );


          showDashboard();

        }

        catch(error) {

          console.error(error);

          loginError.textContent =
            error.message ||
            "Could not sign in.";

        }

        finally {

          loginButton.disabled = false;
          loginButton.textContent = "Sign In";

        }

      }
    );


    /*
      SHOW DASHBOARD
    */

    function showDashboard() {

      document.getElementById(
        "loginScreen"
      ).style.display = "none";


      document.getElementById(
        "dashboard"
      ).style.display = "block";


      loadWaitlist();

    }


    /*
      CHECK EXISTING LOGIN
    */

    const savedToken =
      localStorage.getItem(
        "veyro_access_token"
      );


    if (savedToken) {

      showDashboard();

    }


    /*
      LOAD WAITLIST
    */

    async function loadWaitlist() {

      const body =
        document.getElementById(
          "waitlistBody"
        );

      const status =
        document.getElementById(
          "status"
        );


      status.textContent =
        "Loading waitlist...";


      try {

        const token =
          localStorage.getItem(
            "veyro_access_token"
          );


        if (!token) {

          throw new Error(
            "Not logged in."
          );

        }


        const response =
          await fetch(
            `${SUPABASE_URL}/rest/v1/waitlist?select=id,email,created_at&order=created_at.desc`,
            {
              method: "GET",

              headers: {

                "apikey":
                  SUPABASE_ANON_KEY,

                "Authorization":
                  `Bearer ${token}`

              }
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          console.error(
            "Supabase error:",
            data
          );

          throw new Error(
            data.message ||
            "Could not load waitlist."
          );

        }


        /*
          TOTAL
        */

        document.getElementById(
          "totalSignups"
        ).textContent =
          data.length;


        /*
          TODAY
        */

        const today =
          new Date()
            .toISOString()
            .slice(0, 10);


        const todayCount =
          data.filter(row => {

            return row.created_at
              .slice(0, 10) === today;

          }).length;


        document.getElementById(
          "todaySignups"
        ).textContent =
          todayCount;


        /*
          LATEST
        */

        if (data.length > 0) {

          const latest =
            new Date(
              data[0].created_at
            );


          document.getElementById(
            "latestSignup"
          ).textContent =
            latest.toLocaleDateString();

        }

        else {

          document.getElementById(
            "latestSignup"
          ).textContent =
            "None";

        }


        /*
          TABLE
        */

        if (data.length === 0) {

          body.innerHTML = `
            <tr>
              <td
                colspan="3"
                class="empty"
              >
                No waitlist signups yet.
              </td>
            </tr>
          `;

        }

        else {

          body.innerHTML =
            data.map(row => {

              const date =
                new Date(
                  row.created_at
                );


              return `
                <tr>

                  <td>
                    ${escapeHtml(row.id)}
                  </td>

                  <td>
                    ${escapeHtml(row.email)}
                  </td>

                  <td>
                    ${escapeHtml(
                      date.toLocaleString()
                    )}
                  </td>

                </tr>
              `;

            }).join("");

        }


        status.textContent =
          `Connected • ${data.length} signup${
            data.length === 1
              ? ""
              : "s"
          }`;

      }

      catch(error) {

        console.error(error);


        body.innerHTML = `
          <tr>
            <td
              colspan="3"
              class="empty"
            >
              Could not load waitlist.
            </td>
          </tr>
        `;


        status.textContent =
          "Database connection failed.";

      }

    }


    /*
      HTML ESCAPING
    */

    function escapeHtml(value) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /*
      REFRESH
    */

    document
      .getElementById(
        "refreshButton"
      )
      .addEventListener(
        "click",
        loadWaitlist
      );


    /*
      LOG OUT
    */

    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(
        "click",
        function() {

          localStorage.removeItem(
            "veyro_access_token"
          );

          localStorage.removeItem(
            "veyro_refresh_token"
          );


          document.getElementById(
            "dashboard"
          ).style.display =
            "none";


          document.getElementById(
            "loginScreen"
          ).style.display =
            "flex";

        }
      );

  </script>

</body>
</html>
