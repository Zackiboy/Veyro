<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Veyro Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #070707;
      color: #f5f5f5;
      min-height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    header {
      padding: 25px 6%;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 900;
      letter-spacing: 4px;
      font-size: 22px;
    }

    .admin-label {
      color: #999;
      font-size: 14px;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: #111;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 25px;
      padding: 40px;
    }

    .login-box h1 {
      font-size: 42px;
      letter-spacing: -3px;
      margin-bottom: 10px;
    }

    .login-box p {
      color: #999;
      margin-bottom: 30px;
    }

    .login-box input {
      width: 100%;
      padding: 15px 18px;
      margin-bottom: 12px;
      background: #080808;
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      outline: none;
    }

    .login-box input:focus {
      border-color: rgba(255,255,255,0.35);
    }

    .login-button {
      width: 100%;
      border: none;
      background: white;
      color: black;
      padding: 15px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .login-button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .login-message {
      color: #ff6b55;
      margin-top: 15px;
      font-size: 14px;
    }

    /* DASHBOARD */

    #dashboard {
      display: none;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 60px 6%;
    }

    h1 {
      font-size: clamp(40px, 6vw, 70px);
      letter-spacing: -4px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 45px;
    }

    .dashboard-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .logout {
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: white;
      padding: 9px 16px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 40px;
    }

    .stat {
      background: #111;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 28px;
    }

    .stat-label {
      color: #999;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .stat-value {
      font-size: 42px;
      font-weight: 800;
    }

    .panel {
      background: #111;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      overflow: hidden;
    }

    .panel-header {
      padding: 22px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .panel-header h2 {
      font-size: 20px;
    }

    .refresh {
      border: none;
      background: white;
      color: black;
      padding: 9px 16px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 17px 25px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    th {
      color: #999;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    td {
      color: #ddd;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 50px;
    }

    .status {
      margin-top: 20px;
      color: #999;
      font-size: 14px;
    }

    @media (max-width: 750px) {
      .stats {
        grid-template-columns: 1fr;
      }

      th,
      td {
        padding: 14px;
      }

      .login-box {
        padding: 30px;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen">

  <div class="login-box">

    <h1>Admin.</h1>

    <p>
      Sign in to access the Veyro dashboard.
    </p>

    <form id="loginForm">

      <input
        type="email"
        id="loginEmail"
        placeholder="Admin email"
        required
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        required
      >

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Sign In
      </button>

    </form>

    <div
      class="login-message"
      id="loginMessage"
    ></div>

  </div>

</section>


<!-- DASHBOARD -->

<div id="dashboard">

  <header>

    <div class="logo">
      VEYRO
    </div>

    <div class="dashboard-actions">

      <div class="admin-label">
        ADMIN DASHBOARD
      </div>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </header>


  <main>

    <h1>Dashboard.</h1>

    <p class="subtitle">
      Veyro One waitlist and customer overview.
    </p>


    <div class="stats">

      <div class="stat">

        <div class="stat-label">
          TOTAL SIGNUPS
        </div>

        <div
          class="stat-value"
          id="totalSignups"
        >
          —
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          TODAY
        </div>

        <div
          class="stat-value"
          id="todaySignups"
        >
          —
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          LATEST SIGNUP
        </div>

        <div
          class="stat-value"
          id="latestSignup"
        >
          —
        </div>

      </div>

    </div>


    <div class="panel">

      <div class="panel-header">

        <h2>
          Waitlist
        </h2>

        <button
          class="refresh"
          onclick="loadWaitlist()"
        >
          Refresh
        </button>

      </div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>
              <th>ID</th>
              <th>Email</th>
              <th>Joined</th>
            </tr>

          </thead>


          <tbody id="waitlistBody">

            <tr>

              <td
                colspan="3"
                class="empty"
              >
                Loading...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>


    <div
      class="status"
      id="status"
    >
      Connecting...
    </div>

  </main>

</div>


<script>

const SUPABASE_URL =
  "https://vltduiizkbzuupeyjdms.supabase.co";

const SUPABASE_ANON_KEY =
  "YOUR_PUBLISHABLE_KEY_HERE";


/* LOGIN */

const loginForm =
  document.getElementById("loginForm");

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("loginMessage");

    button.disabled = true;
    button.textContent = "Signing in...";
    message.textContent = "";

    try {

      const response = await fetch(
        `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error_description ||
          data.msg ||
          "Login failed"
        );
      }

      localStorage.setItem(
        "veyro_access_token",
        data.access_token
      );

      localStorage.setItem(
        "veyro_refresh_token",
        data.refresh_token
      );

      showDashboard();

    } catch (error) {

      console.error(error);

      message.textContent =
        "Incorrect email or password.";

    } finally {

      button.disabled = false;
      button.textContent = "Sign In";

    }

  }
);


/* SHOW DASHBOARD */

function showDashboard() {

  document.getElementById("loginScreen")
    .classList.add("hidden");

  document.getElementById("dashboard")
    .style.display = "block";

  loadWaitlist();

}


/* LOAD WAITLIST */

async function loadWaitlist() {

  const body =
    document.getElementById("waitlistBody");

  const status =
    document.getElementById("status");

  const accessToken =
    localStorage.getItem("veyro_access_token");

  if (!accessToken) {
    return;
  }

  status.textContent =
    "Loading...";

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/waitlist?select=id,email,created_at&order=created_at.desc`,
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization":
            `Bearer ${accessToken}`
        }
      }
    );

    if (!response.ok) {

      const error =
        await response.text();

      console.error(error);

      throw new Error(error);

    }

    const data =
      await response.json();


    document.getElementById(
      "totalSignups"
    ).textContent = data.length;


    const today =
      new Date().toISOString().slice(0, 10);


    const todayCount =
      data.filter(row => {

        return row.created_at.slice(0, 10)
          === today;

      }).length;


    document.getElementById(
      "todaySignups"
    ).textContent = todayCount;


    if (data.length > 0) {

      const latestDate =
        new Date(data[0].created_at);

      document.getElementById(
        "latestSignup"
      ).textContent =
        latestDate.toLocaleDateString();

    } else {

      document.getElementById(
        "latestSignup"
      ).textContent = "None";

    }


    if (data.length === 0) {

      body.innerHTML = `
        <tr>
          <td colspan="3" class="empty">
            No waitlist signups yet.
          </td>
        </tr>
      `;

    } else {

      body.innerHTML =
        data.map(row => {

          const date =
            new Date(row.created_at);

          return `
            <tr>
              <td>${row.id}</td>
              <td>${escapeHtml(row.email)}</td>
              <td>${date.toLocaleString()}</td>
            </tr>
          `;

        }).join("");

    }


    status.textContent =
      `Connected • ${data.length} signup${data.length === 1 ? "" : "s"}`;

  } catch (error) {

    console.error(error);

    body.innerHTML = `
      <tr>
        <td colspan="3" class="empty">
          Could not load waitlist.
        </td>
      </tr>
    `;

    status.textContent =
      "You are logged in, but the database still needs the admin read permission.";

  }

}


/* ESCAPE HTML */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* LOGOUT */

function logout() {

  localStorage.removeItem(
    "veyro_access_token"
  );

  localStorage.removeItem(
    "veyro_refresh_token"
  );

  location.reload();

}


/* CHECK EXISTING LOGIN */

if (
  localStorage.getItem(
    "veyro_access_token"
  )
) {

  showDashboard();

}

</script>

</body>
</html>
