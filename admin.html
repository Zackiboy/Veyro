<body>


<!-- ========================================================= -->
<!-- LOGIN -->
<!-- ========================================================= -->

<div id="loginScreen">

  <div class="login-box">

    <div class="login-logo">
      VEYRO
    </div>

    <h1>Admin.</h1>

    <p class="login-subtitle">
      Sign in to manage the Veyro One waitlist.
    </p>

    <form id="loginForm">

      <input
        class="login-input"
        type="email"
        id="loginEmail"
        placeholder="Admin email"
        autocomplete="email"
        required
      >

      <input
        class="login-input"
        type="password"
        id="loginPassword"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button
        class="login-button"
        id="loginButton"
        type="submit"
      >
        Sign In
      </button>

    </form>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- ========================================================= -->
<!-- DASHBOARD -->
<!-- ========================================================= -->

<div id="dashboard">

  <header>

    <div class="logo">
      VEYRO
    </div>

    <div class="header-right">

      <div class="admin-label">
        ADMIN DASHBOARD
      </div>

      <button
        class="logout"
        id="logoutButton"
      >
        Log Out
      </button>

    </div>

  </header>


  <main>

    <h1>Dashboard.</h1>

    <p class="subtitle">
      Veyro One waitlist and customer overview.
    </p>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">

        <div class="stat-label">
          TOTAL SIGNUPS
        </div>

        <div
          class="stat-value"
          id="totalSignups"
        >
          —
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          TODAY
        </div>

        <div
          class="stat-value"
          id="todaySignups"
        >
          —
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          LATEST SIGNUP
        </div>

        <div
          class="stat-value"
          id="latestSignup"
        >
          —
        </div>

      </div>

    </div>


    <!-- WAITLIST -->

    <div class="panel">

      <div class="panel-header">

        <h2>
          Waitlist
        </h2>

        <button
          class="refresh"
          id="refreshButton"
        >
          Refresh
        </button>

      </div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>
              <th>ID</th>
              <th>Email</th>
              <th>Joined</th>
            </tr>

          </thead>


          <tbody id="waitlistBody">

            <tr>

              <td
                colspan="3"
                class="empty"
              >
                Loading...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>


    <div
      class="status"
      id="status"
    >
      Connecting to Veyro database...
    </div>

  </main>

</div>


<script>

/* ============================================================
   SUPABASE CONFIG
   ============================================================ */

const SUPABASE_URL =
  "https://vltduiizkbzuupeyjdms.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_RZSnpBfbRIwQju3yqJl3eQ_ZugOxIdJ";


/* ============================================================
   ELEMENTS
   ============================================================ */

const loginScreen =
  document.getElementById("loginScreen");

const dashboard =
  document.getElementById("dashboard");

const loginForm =
  document.getElementById("loginForm");

const loginButton =
  document.getElementById("loginButton");

const loginMessage =
  document.getElementById("loginMessage");


/* ============================================================
   SUPABASE LOGIN
   ============================================================ */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("loginPassword")
        .value;


    loginButton.disabled = true;
    loginButton.textContent = "Signing In...";
    loginMessage.textContent = "";


    try {

      const response =
        await fetch(
          `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_ANON_KEY
            },

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error_description ||
          data.msg ||
          data.message ||
          "Login failed."
        );

      }


      /*
        Save the Supabase session.
      */

      localStorage.setItem(
        "veyro_access_token",
        data.access_token
      );

      localStorage.setItem(
        "veyro_refresh_token",
        data.refresh_token
      );


      showDashboard();

    }

    catch(error) {

      console.error(
        "Veyro login error:",
        error
      );

      loginMessage.textContent =
        error.message ||
        "Could not sign in.";

    }

    finally {

      loginButton.disabled = false;
      loginButton.textContent = "Sign In";

    }

  }
);


/* ============================================================
   SHOW DASHBOARD
   ============================================================ */

function showDashboard() {

  loginScreen.style.display =
    "none";

  dashboard.style.display =
    "block";

  loadWaitlist();

}


/* ============================================================
   LOGOUT
   ============================================================ */

document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    function() {

      localStorage.removeItem(
        "veyro_access_token"
      );

      localStorage.removeItem(
        "veyro_refresh_token"
      );

      dashboard.style.display =
        "none";

      loginScreen.style.display =
        "flex";

      document
        .getElementById("loginPassword")
        .value = "";

      loginMessage.textContent = "";

    }
  );


/* ============================================================
   LOAD WAITLIST
   ============================================================ */

async function loadWaitlist() {

  const body =
    document.getElementById(
      "waitlistBody"
    );

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    "Loading...";


  try {

    const token =
      localStorage.getItem(
        "veyro_access_token"
      );


    if (!token) {

      throw new Error(
        "You are not logged in."
      );

    }


    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/waitlist?select=id,email,created_at&order=created_at.desc`,
        {
          method: "GET",

          headers: {

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${token}`

          }

        }
      );


    const responseText =
      await response.text();


    if (!response.ok) {

      console.error(
        "Supabase response:",
        responseText
      );

      /*
        If the session has expired,
        return to login.
      */

      if (
        response.status === 401 ||
        response.status === 403
      ) {

        localStorage.removeItem(
          "veyro_access_token"
        );

        localStorage.removeItem(
          "veyro_refresh_token"
        );

        dashboard.style.display =
          "none";

        loginScreen.style.display =
          "flex";

        loginMessage.textContent =
          "Your session expired. Please sign in again.";

        return;

      }

      throw new Error(
        responseText ||
        "Could not load waitlist."
      );

    }


    const data =
      JSON.parse(responseText);


    /* ========================================================
       TOTAL SIGNUPS
       ======================================================== */

    document.getElementById(
      "totalSignups"
    ).textContent =
      data.length;


    /* ========================================================
       TODAY
       ======================================================== */

    const today =
      new Date()
        .toISOString()
        .slice(0, 10);


    const todayCount =
      data.filter(row => {

        return row.created_at
          .slice(0, 10) === today;

      }).length;


    document.getElementById(
      "todaySignups"
    ).textContent =
      todayCount;


    /* ========================================================
       LATEST SIGNUP
       ======================================================== */

    if (data.length > 0) {

      const latestDate =
        new Date(
          data[0].created_at
        );


      document.getElementById(
        "latestSignup"
      ).textContent =
        latestDate.toLocaleDateString();

    }

    else {

      document.getElementById(
        "latestSignup"
      ).textContent =
        "None";

    }


    /* ========================================================
       TABLE
       ======================================================== */

    if (data.length === 0) {

      body.innerHTML = `
        <tr>
          <td
            colspan="3"
            class="empty"
          >
            No waitlist signups yet.
          </td>
        </tr>
      `;

    }

    else {

      body.innerHTML =
        data.map(row => {

          const date =
            new Date(
              row.created_at
            );


          return `
            <tr>

              <td>
                ${escapeHtml(row.id)}
              </td>

              <td>
                ${escapeHtml(row.email)}
              </td>

              <td>
                ${escapeHtml(
                  date.toLocaleString()
                )}
              </td>

            </tr>
          `;

        }).join("");

    }


    status.textContent =
      `Connected • ${data.length} signup${
        data.length === 1
          ? ""
          : "s"
      }`;

  }

  catch(error) {

    console.error(
      "Veyro dashboard error:",
      error
    );


    body.innerHTML = `
      <tr>
        <td
          colspan="3"
          class="empty"
        >
          Could not load waitlist.
        </td>
      </tr>
    `;


    status.textContent =
      "Database connection failed.";

  }

}


/* ============================================================
   REFRESH
   ============================================================ */

document
  .getElementById("refreshButton")
  .addEventListener(
    "click",
    loadWaitlist
  );


/* ============================================================
   HTML ESCAPING
   ============================================================ */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ============================================================
   CHECK EXISTING SESSION
   ============================================================ */

const existingToken =
  localStorage.getItem(
    "veyro_access_token"
  );


if (existingToken) {

  showDashboard();

}

</script>

</body>
</html>
